name: CI

on:
  push:
    branches:
      - main
      - "chama/**"

  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examscope_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/examscope_ci
      AUTH_SECRET: ci-test-secret-examscope
      FASTAPI_BASE_URL: http://127.0.0.1:8000
      INTERNAL_API_KEY: ci-internal-api-key
      AWS_ENDPOINT_URL_S3: http://localhost:9000
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: examscope-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      INTERNAL_API_KEY: ci-internal-api-key
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: openrouter/free
      GENERATION_TIMEOUT_SECONDS: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python source
        run: |
          python -m compileall app

      - name: Verify FastAPI app import
        run: |
          python -c "from app.main import app; print('FastAPI app loaded successfully')"